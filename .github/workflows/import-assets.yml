name: Import assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode assets
        run: |
          set -e
          mkdir -p assets
          for f in _upload/*.b64; do
            out="assets/$(basename "$f" .b64)"
            base64 -d "$f" > "$out"
            echo "$out $(wc -c < "$out") bytes"
          done
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf _upload
          git rm -f .github/workflows/import-assets.yml
          git add -A
          git commit -m "Ajout des documents iconographiques"
          git push
